# ops-assist 配置文件
# Linux 运维智能巡检与日志诊断助手

# 磁盘使用率告警阈值（百分比）
DISK_WARN_THRESHOLD=80
DISK_CRITICAL_THRESHOLD=90

# 内存使用率告警阈值（百分比）
MEM_WARN_THRESHOLD=80
MEM_CRITICAL_THRESHOLD=90

# CPU负载告警阈值
CPU_LOAD_WARN=2.0

# 巡检日志输出目录
CHECK_OUTPUT=""

# 日志分析输出目录
LOG_OUTPUT=""

# 报告输出目录
REPORT_OUTPUT=""

# 默认报告格式: markdown 或 html
REPORT_FORMAT="markdown"

# 需要监控的服务列表（空格分隔）
# ops-blog 是本项目 web-blog 部署后的 systemd 服务名
WATCH_SERVICES="sshd ops-blog"

# 需要监控的端口列表（空格分隔）
WATCH_PORTS="22 80"

# 需要访问验证的 HTTP 健康检查地址（空格分隔）
HEALTH_URLS="http://127.0.0.1/healthz.txt"

# 日志分析关键词（正则表达式）
LOG_PATTERNS="error|failed|denied|timeout|disconnect|refused|panic|OOM|segfault"
